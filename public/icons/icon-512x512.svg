<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Fondo con gradiente -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo redondeado (esquinas redondeadas como los iconos de iOS) -->
  <rect width="512" height="512" rx="112.64" fill="url(#bg)"/>
  
  <!-- Icono de billetera simplificado -->
  <!-- Cuerpo principal de la billetera -->
  <rect x="148.48000000000002" y="182.52800000000002" width="215.04" height="161.28" 
        rx="24.192" fill="white" opacity="0.95"/>
  
  <!-- Solapa superior de la billetera -->
  <rect x="148.48000000000002" y="163.17440000000002" width="161.28" height="32.256" 
        rx="12.9024" fill="white" opacity="0.7"/>
  
  <!-- Cierre / botón de la billetera -->
  <circle cx="324.8128" cy="263.168" 
          r="19.3536" fill="#6366f1" opacity="0.8"/>
  <circle cx="324.8128" cy="263.168" 
          r="9.6768" fill="white"/>
  
  <!-- Línea decorativa tipo tarjeta -->
  <line x1="169.984" y1="238.976" 
        x2="256" y2="238.976" 
        stroke="#c7d2fe" stroke-width="6.144" stroke-linecap="round"/>
  <line x1="169.984" y1="266.3936" 
        x2="223.74400000000003" y2="266.3936" 
        stroke="#c7d2fe" stroke-width="6.144" stroke-linecap="round"/>
  
  <!-- Texto "SW" debajo -->
  <text x="256" y="422.656" 
        text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
        font-size="50.176" font-weight="700" fill="white" opacity="0.9">
    SplitWallet
  </text>
</svg>