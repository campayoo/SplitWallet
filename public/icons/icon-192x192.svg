<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Fondo con gradiente -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo redondeado (esquinas redondeadas como los iconos de iOS) -->
  <rect width="192" height="192" rx="42.24" fill="url(#bg)"/>
  
  <!-- Icono de billetera simplificado -->
  <!-- Cuerpo principal de la billetera -->
  <rect x="55.68" y="68.448" width="80.64" height="60.480000000000004" 
        rx="9.072000000000001" fill="white" opacity="0.95"/>
  
  <!-- Solapa superior de la billetera -->
  <rect x="55.68" y="61.1904" width="60.480000000000004" height="12.096000000000002" 
        rx="4.8384" fill="white" opacity="0.7"/>
  
  <!-- Cierre / botón de la billetera -->
  <circle cx="121.8048" cy="98.68799999999999" 
          r="7.2576" fill="#6366f1" opacity="0.8"/>
  <circle cx="121.8048" cy="98.68799999999999" 
          r="3.6288" fill="white"/>
  
  <!-- Línea decorativa tipo tarjeta -->
  <line x1="63.744" y1="89.61599999999999" 
        x2="96" y2="89.61599999999999" 
        stroke="#c7d2fe" stroke-width="2.3040000000000003" stroke-linecap="round"/>
  <line x1="63.744" y1="99.8976" 
        x2="83.904" y2="99.8976" 
        stroke="#c7d2fe" stroke-width="2.3040000000000003" stroke-linecap="round"/>
  
  <!-- Texto "SW" debajo -->
  <text x="96" y="158.496" 
        text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
        font-size="18.816000000000003" font-weight="700" fill="white" opacity="0.9">
    SplitWallet
  </text>
</svg>